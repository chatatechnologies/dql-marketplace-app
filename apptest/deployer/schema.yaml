x-google-marketplace:
  schemaVersion: v2
  images:
    tester:
      properties:
        tester.image.repo:
          type: REPO_WITH_REGISTRY
        tester.image.tag:
          type: TAG

properties:
  secrets.PEM_SECRET:
    type: string
    default: test
    x-google-marketplace:
      type: STRING

  secrets.JSON_SECRET:
    type: string
    default: test
    x-google-marketplace:
      type: STRING

  secrets.JWT_SECRET:
    type: string
    default: test
    x-google-marketplace:
      type: STRING
      
  configmap.BACKEND_SUBDOMAIN:
    type: string
    default: 'api-marketplace.chata.io'
    x-google-marketplace:
      type: STRING

  configmap.PORTAL_SUBDOMAIN:
    type: string
    default: 'portal-marketplace.chata.io'
    x-google-marketplace:
      type: STRING

  configmap.WEBAPP_SUBDOMAIN:
    type: string
    default: 'webapp-marketplace.chata.io'
    x-google-marketplace:
      type: STRING

  configmap.EXCEL_SUBDOMAIN:
    type: string
    default: 'excel-marketplace.chata.io'
    x-google-marketplace:
      type: STRING

  configmap.ADMIN_EMAIL:
    type: string
    default: 'developer@chata.ai'
    x-google-marketplace:
      type: STRING

  configmap.ADMIN_FIRST_NAME:
    type: string
    default: developer
    x-google-marketplace:
      type: STRING

  configmap.ADMIN_LAST_NAME:
    type: string
    default: developer
    x-google-marketplace:
      type: STRING

  configmap.INTEGRATOR_BUCKET:
    type: string
    default: 'gs://diy_test'
    x-google-marketplace:
      type: STRING

  configmap.INTEGRATOR_ID:
    type: integer
    default: 3010

  configmap.ENVIRONMENT:
    type: string
    default: 'staging'
    x-google-marketplace:
      type: STRING

  configmap.SPOT_INSTANCES_ENABLED:
    type: string
    default: 'true'
    x-google-marketplace:
      type: STRING

  configmap.REPLICAS_OVERRIDE_VALUE:
    type: string
    default: '1'
    x-google-marketplace:
      type: STRING

  configmap.CPU_OVERRIDE_VALUE:
    type: string
    default: '0.5'
    x-google-marketplace:
      type: STRING

  secrets.TLS_CERTIFICATE_VALUE:
    type: string
    default: test
    x-google-marketplace:
      type: STRING

  secrets.TLS_PRIVATE_KEY_VALUE:
    type: string
    default: test
    x-google-marketplace:
      type: STRING